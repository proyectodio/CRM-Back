services:
  db:
    image: postgres:16
    container_name: dio_db
    environment:
      POSTGRES_USER: dio
      POSTGRES_PASSWORD: dio
      POSTGRES_DB: dio
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dio -d dio"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dio_pg:/var/lib/postgresql/data

  api:
    build: .
    container_name: dio_api
    environment:
      POSTGRES_USER: dio
      POSTGRES_PASSWORD: dio
      POSTGRES_DB: dio
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      JWT_SECRET: cambia-esta-clave-jwt-de-desarrollo-dio
      JWT_EXPIRE_MINUTES: "1440"
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dio_pg:
